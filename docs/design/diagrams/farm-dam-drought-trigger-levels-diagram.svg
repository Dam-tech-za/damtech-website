<svg viewBox="0 0 420 270" role="img" aria-label="Cross-section of a farm dam in a drought with four marked water levels: full supply, trigger 1 to stop irrigating, trigger 2 for stock and household only, and an emergency reserve." class="base-diagram__svg"><defs><pattern id="dl-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" class="base-diagram__hatch-line"/></pattern></defs><path d="M0 50 H20 L140 210 H280 L400 50 H420 V250 H0 Z" fill="url(#dl-hatch)" class="base-diagram__ground"/><path d="M95 150 H325 L280 210 H140 Z" class="base-diagram__water"/><path d="M20 50 L140 210 H280 L400 50" class="base-diagram__liner"/><path d="M14 58 H406" class="base-diagram__lead"/><text x="210" y="52" text-anchor="middle" class="base-diagram__label">Full: water at the spillway</text><path d="M14 98 H406" class="base-diagram__lead"/><text x="210" y="92" text-anchor="middle" class="base-diagram__label">Trigger 1: stop irrigating</text><path d="M14 138 H406" class="base-diagram__lead"/><text x="210" y="132" text-anchor="middle" class="base-diagram__label">Trigger 2: stock and house only</text><path d="M14 178 H406" class="base-diagram__lead"/><text x="210" y="172" text-anchor="middle" class="base-diagram__label">Reserve: emergencies only</text><rect x="352" y="60" width="6" height="128" class="base-diagram__concrete"/><text x="406" y="236" text-anchor="end" class="base-diagram__label">Gauge board</text><path d="M372 224 L357 192" class="base-diagram__lead"/><text x="14" y="236" text-anchor="start" class="base-diagram__small">Water level today</text><path d="M60 230 L110 152" class="base-diagram__lead"/></svg>
