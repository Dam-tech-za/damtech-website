<svg viewBox="0 0 420 230" role="img" aria-label="Farm water chain for an El Niño summer: borehole or dam, then a storage tank as a buffer, then troughs and taps, with leaks fixed and dams lined at the source." class="base-diagram__svg"><text x="14" y="28" class="base-diagram__label">Secure the whole chain, not just the source</text><rect x="12" y="62" width="116" height="66" rx="4" class="base-diagram__sand"/><text x="70" y="91" text-anchor="middle" class="base-diagram__label">Borehole</text><text x="70" y="109" text-anchor="middle" class="base-diagram__label">or dam</text><rect x="152" y="62" width="116" height="66" rx="4" class="base-diagram__water"/><text x="210" y="91" text-anchor="middle" class="base-diagram__label">Storage</text><text x="210" y="109" text-anchor="middle" class="base-diagram__label">tank</text><rect x="292" y="62" width="116" height="66" rx="4" class="base-diagram__concrete"/><text x="350" y="91" text-anchor="middle" class="base-diagram__label">Troughs</text><text x="350" y="109" text-anchor="middle" class="base-diagram__label">and taps</text><path d="M130 95 H148 M142 89 L148 95 L142 101" class="base-diagram__dim"/><path d="M270 95 H288 M282 89 L288 95 L282 101" class="base-diagram__dim"/><text x="70" y="152" text-anchor="middle" class="base-diagram__small">Fix leaks</text><text x="70" y="168" text-anchor="middle" class="base-diagram__small">Line dams that leak</text><text x="210" y="152" text-anchor="middle" class="base-diagram__small">A buffer you control</text><text x="210" y="168" text-anchor="middle" class="base-diagram__small">Size it with a calculator</text><text x="350" y="152" text-anchor="middle" class="base-diagram__small">More water points</text><text x="350" y="168" text-anchor="middle" class="base-diagram__small">Check pumps and pipes</text><text x="14" y="210" class="base-diagram__small">Plan dam levels early and watch them weekly</text></svg>
