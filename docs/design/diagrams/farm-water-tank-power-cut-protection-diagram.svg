<svg viewBox="0 0 420 290" role="img" aria-label="Farm water storage that copes with power cuts: a covered tank on high ground with a non-return valve, float valve and overflow, feeding a trough by gravity." class="base-diagram__svg"><defs><pattern id="fpc-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" class="base-diagram__hatch-line"/></pattern></defs><path d="M0 150 H200 L300 200 H420 V290 H0 Z" fill="url(#fpc-hatch)" class="base-diagram__ground"/><path d="M0 150 H200 L300 200 H420" class="base-diagram__surface"/><path d="M32 144 H178 L184 150 H26 Z" class="base-diagram__sand"/><rect x="42" y="80" width="126" height="62" class="base-diagram__water"/><path d="M42 60 V143 H168 V60" class="base-diagram__liner"/><path d="M40 58 V144" class="base-diagram__steel"/><path d="M170 58 V144" class="base-diagram__steel"/><path d="M36 58 L105 38 L174 58" class="base-diagram__surface"/><path d="M20 150 V66 H62 V74" class="base-diagram__link"/><rect x="14" y="102" width="12" height="16" class="base-diagram__separator"/><path d="M62 74 L74 80" class="base-diagram__link"/><circle cx="78" cy="82" r="5" class="base-diagram__stone"/><path d="M170 74 H192 V150" class="base-diagram__link"/><path d="M170 136 H205 L298 184 H352 V186" class="base-diagram__link"/><rect x="330" y="182" width="60" height="18" class="base-diagram__concrete"/><rect x="333" y="186" width="54" height="8" class="base-diagram__water"/><text x="14" y="24" class="base-diagram__label">Cover keeps out dust and birds</text><path d="M110 30 L106 40" class="base-diagram__lead"/><text x="54" y="124" class="base-diagram__label">Float valve</text><path d="M80 110 L79 88" class="base-diagram__lead"/><text x="204" y="102" class="base-diagram__label">Overflow led away</text><path d="M202 98 L193 92" class="base-diagram__lead"/><text x="14" y="196" class="base-diagram__label">Non-return valve</text><text x="14" y="214" class="base-diagram__label">stops backflow</text><path d="M22 182 L20 120" class="base-diagram__lead"/><text x="406" y="246" text-anchor="end" class="base-diagram__label">Gravity feed works</text><text x="406" y="264" text-anchor="end" class="base-diagram__label">with no power</text><path d="M330 234 L300 186" class="base-diagram__lead"/></svg>
