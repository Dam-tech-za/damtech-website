<svg viewBox="0 0 420 270" role="img" aria-label="Side-by-side sketch: an unlined earth dam loses water to evaporation from its open surface and seepage through its floor, while a roofed, lined steel reservoir loses far less." class="base-diagram__svg"><defs><pattern id="srcb-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" class="base-diagram__hatch-line"/></pattern></defs><path d="M0 170 H20 L60 215 H150 L190 170 H420 V240 H0 Z" fill="url(#srcb-hatch)" class="base-diagram__ground"/><path d="M0 170 H20 L60 215 H150 L190 170 H420" class="base-diagram__surface"/><path d="M29 180 L60 215 H150 L181 180 Z" class="base-diagram__water"/><text x="105" y="30" text-anchor="middle" class="base-diagram__label">Unlined earth dam</text><path d="M80 176 V150 M75 157 L80 150 L85 157 M130 176 V150 M125 157 L130 150 L135 157" class="base-diagram__dim"/><text x="105" y="140" text-anchor="middle" class="base-diagram__dim-text">Evaporation</text><path d="M80 218 V236 M75 229 L80 236 L85 229 M130 218 V236 M125 229 L130 236 L135 229" class="base-diagram__dim"/><text x="105" y="258" text-anchor="middle" class="base-diagram__dim-text">Seepage</text><text x="320" y="30" text-anchor="middle" class="base-diagram__label">Lined steel reservoir</text><rect x="255" y="120" width="130" height="47" class="base-diagram__water"/><path d="M255 99 V167 H385 V99" class="base-diagram__liner"/><path d="M252 96 V170 M388 96 V170" class="base-diagram__steel"/><path d="M246 98 L320 74 L394 98" class="base-diagram__steel"/><text x="320" y="56" text-anchor="middle" class="base-diagram__label">Roof cuts evaporation</text><path d="M320 61 V74" class="base-diagram__lead"/><text x="320" y="258" text-anchor="middle" class="base-diagram__label">Liner stops seepage</text><path d="M320 244 V168" class="base-diagram__lead"/></svg>
