<svg viewBox="0 0 420 280" role="img" aria-label="Coating layers on steel sheet: Z275 galvanised is about 19.3 micrometres of zinc per face; AZ150 Aluzinc is about 20.0 micrometres but mostly aluminium-rich crystals, with about a quarter of the zinc." class="base-diagram__svg"><defs><pattern id="az-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" class="base-diagram__hatch-line"/></pattern></defs><text x="105" y="28" text-anchor="middle" class="base-diagram__label">Z275 galvanised</text><text x="105" y="46" text-anchor="middle" class="base-diagram__small">About 19.3 µm per face</text><text x="315" y="28" text-anchor="middle" class="base-diagram__label">AZ150 Aluzinc</text><text x="315" y="46" text-anchor="middle" class="base-diagram__small">About 20.0 µm per face</text><rect x="30" y="110" width="150" height="58" class="base-diagram__water"/><rect x="240" y="108" width="150" height="60" class="base-diagram__water"/><rect x="244" y="112" width="22" height="52" rx="6" class="base-diagram__sand"/><rect x="272" y="116" width="20" height="48" rx="6" class="base-diagram__sand"/><rect x="298" y="111" width="24" height="53" rx="6" class="base-diagram__sand"/><rect x="328" y="115" width="20" height="49" rx="6" class="base-diagram__sand"/><rect x="354" y="112" width="32" height="52" rx="6" class="base-diagram__sand"/><rect x="30" y="168" width="150" height="46" fill="url(#az-hatch)" class="base-diagram__concrete"/><rect x="240" y="168" width="150" height="46" fill="url(#az-hatch)" class="base-diagram__concrete"/><text x="105" y="196" text-anchor="middle" class="base-diagram__label">Steel sheet</text><text x="315" y="196" text-anchor="middle" class="base-diagram__label">Steel sheet</text><rect x="30" y="70" width="14" height="14" class="base-diagram__water"/><text x="50" y="82" class="base-diagram__small">Zinc (in both coatings)</text><rect x="240" y="70" width="14" height="14" class="base-diagram__sand"/><text x="260" y="82" class="base-diagram__small">Aluminium-rich crystals</text><text x="105" y="242" text-anchor="middle" class="base-diagram__label">137.5 g/m² zinc</text><text x="315" y="242" text-anchor="middle" class="base-diagram__label">32.6 g/m² zinc</text><text x="315" y="260" text-anchor="middle" class="base-diagram__small">About 24% of Z275's zinc</text></svg>
