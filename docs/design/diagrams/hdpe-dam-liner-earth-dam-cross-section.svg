<svg viewBox="0 0 420 270" role="img" aria-label="Cross-section of an earth dam lined with HDPE: the welded liner covers the floor and both slopes, sits on a smooth stone-free base with geotextile under it, and is buried in an anchor trench at each crest." class="base-diagram__svg"><defs><pattern id="hdx-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" class="base-diagram__hatch-line"/></pattern><pattern id="hdx-sand" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" class="base-diagram__grain"/><circle cx="6.5" cy="6" r="0.9" class="base-diagram__grain"/></pattern></defs><path d="M0 80 H60 L140 165 H280 L360 80 H420 V200 H0 Z" fill="url(#hdx-hatch)" class="base-diagram__ground"/><path d="M77 98 L140 165 H280 L343 98 Z" class="base-diagram__water"/><rect x="24" y="80" width="14" height="22" class="base-diagram__sand"/><rect x="24" y="80" width="14" height="22" fill="url(#hdx-sand)"/><rect x="382" y="80" width="14" height="22" class="base-diagram__sand"/><rect x="382" y="80" width="14" height="22" fill="url(#hdx-sand)"/><path d="M143 169 H277" class="base-diagram__geo"/><path d="M31 100 V80 H60 L140 165 H280 L360 80 H389 V100" class="base-diagram__liner"/><text x="14" y="28" text-anchor="start" class="base-diagram__label">Anchor trench</text><path d="M40 34 L31 84" class="base-diagram__lead"/><text x="406" y="28" text-anchor="end" class="base-diagram__label">HDPE liner, welded on site</text><path d="M330 34 L322 121" class="base-diagram__lead"/><text x="210" y="134" text-anchor="middle" class="base-diagram__small">Water stays in the dam</text><text x="14" y="226" text-anchor="start" class="base-diagram__label">Geotextile on rough ground</text><path d="M120 214 L160 171" class="base-diagram__lead"/><text x="406" y="250" text-anchor="end" class="base-diagram__label">Smooth, stone-free base</text><path d="M250 236 L250 168" class="base-diagram__lead"/></svg>
