<svg viewBox="0 0 420 270" role="img" aria-label="Cross-section of a steel water tank on a sand pad: the PVC liner lies on geotextile over a compacted sand or crusher-dust pad that is wider than the tank, with a stone band at the edge and firm ground below." class="base-diagram__svg"><defs><pattern id="tb-hatch-pad" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" class="base-diagram__hatch-line"/></pattern><pattern id="tb-hatch-pad-sand" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" class="base-diagram__grain"/><circle cx="6.5" cy="6" r="0.9" class="base-diagram__grain"/></pattern></defs><rect x="0" y="172" width="420" height="40" fill="url(#tb-hatch-pad)" class="base-diagram__ground"/><path d="M14 24 V212" class="base-diagram__centre"/><text x="18" y="20" class="base-diagram__small">Centre of tank</text><path d="M0 150 H350 L392 172 H0 Z" class="base-diagram__sand"/><path d="M0 150 H350 L392 172 H0 Z" fill="url(#tb-hatch-pad-sand)"/><path d="M0 153 H346" class="base-diagram__geo"/><rect x="20" y="58" width="278" height="90" class="base-diagram__water"/><path d="M20 149 H297 V36" class="base-diagram__liner"/><path d="M300 32 V150" class="base-diagram__steel"/><path d="M297 36 Q300 28 304 36" class="base-diagram__liner"/><circle cx="306" cy="147" r="3.6" class="base-diagram__stone"/><circle cx="314" cy="146" r="3.6" class="base-diagram__stone"/><circle cx="322" cy="147" r="3.6" class="base-diagram__stone"/><circle cx="330" cy="146" r="3.6" class="base-diagram__stone"/><circle cx="338" cy="147" r="3.6" class="base-diagram__stone"/><circle cx="346" cy="146" r="3.6" class="base-diagram__stone"/><text x="36" y="84" text-anchor="start" class="base-diagram__label">Steel wall</text><path d="M106 80 L296 60" class="base-diagram__lead"/><text x="36" y="112" text-anchor="start" class="base-diagram__label">PVC liner on the floor</text><path d="M208 108 L236 147" class="base-diagram__lead"/><text x="14" y="232" text-anchor="start" class="base-diagram__label">Geotextile under the liner</text><path d="M206 222 L206 154" class="base-diagram__lead"/><text x="14" y="252" text-anchor="start" class="base-diagram__label">Compacted sand or crusher dust</text><path d="M242 242 L242 162" class="base-diagram__lead"/><text x="406" y="232" text-anchor="end" class="base-diagram__label">Stone band</text><path d="M362 220 L332 146" class="base-diagram__lead"/><text x="406" y="252" text-anchor="end" class="base-diagram__label">stops washout</text></svg>
