<svg viewBox="0 0 420 320" role="img" aria-label="Cross-section of a lined farm dam with five weak points numbered: the liner edge at the crest, the waterline band, the pipe through the bank, a stone under the floor and the slope where livestock walk in." class="base-diagram__svg"><defs><pattern id="fdf-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" class="base-diagram__hatch-line"/></pattern></defs><path d="M0 60 H60 L140 145 H280 L360 60 H420 V190 H0 Z" fill="url(#fdf-hatch)" class="base-diagram__ground"/><path d="M77 78 L140 145 H280 L343 78 Z" class="base-diagram__water"/><rect x="296" y="126" width="124" height="8" class="base-diagram__concrete"/><circle cx="200" cy="150" r="5" class="base-diagram__stone"/><path d="M31 76 V60 H60 L140 145 H192 Q200 136 208 145 H280 L360 60 H389 V76" class="base-diagram__liner"/><circle cx="46" cy="44" r="10" class="base-diagram__liner"/><text x="46" y="49" text-anchor="middle" class="base-diagram__dim-text">1</text><circle cx="62" cy="88" r="10" class="base-diagram__liner"/><text x="62" y="93" text-anchor="middle" class="base-diagram__dim-text">2</text><path d="M375 104 L300 129" class="base-diagram__lead"/><circle cx="384" cy="100" r="10" class="base-diagram__liner"/><text x="384" y="105" text-anchor="middle" class="base-diagram__dim-text">3</text><circle cx="200" cy="168" r="10" class="base-diagram__liner"/><text x="200" y="173" text-anchor="middle" class="base-diagram__dim-text">4</text><circle cx="124" cy="104" r="10" class="base-diagram__liner"/><text x="124" y="109" text-anchor="middle" class="base-diagram__dim-text">5</text><text x="14" y="216" text-anchor="start" class="base-diagram__label">1  Edge pulled loose by wind</text><text x="14" y="238" text-anchor="start" class="base-diagram__label">2  Sun and wear at the waterline</text><text x="14" y="260" text-anchor="start" class="base-diagram__label">3  Leak round a pipe through the bank</text><text x="14" y="282" text-anchor="start" class="base-diagram__label">4  Stone pushing up under the liner</text><text x="14" y="304" text-anchor="start" class="base-diagram__label">5  Hooves where livestock walk in</text></svg>
