<svg viewBox="0 0 420 290" role="img" aria-label="Three zones on the inside of a galvanised steel water tank wall: the damp headspace under the roof, the waterline band that goes wet and dry, and the submerged wall. The outside face sits in the open air." class="base-diagram__svg"><defs><pattern id="gz-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" class="base-diagram__hatch-line"/></pattern></defs><rect x="0" y="240" width="420" height="22" fill="url(#gz-hatch)" class="base-diagram__ground"/><path d="M0 240 H420" class="base-diagram__surface"/><path d="M14 30 L170 42" class="base-diagram__steel"/><rect x="16" y="135" width="152" height="104" class="base-diagram__water"/><path d="M16 100 H168" class="base-diagram__lead"/><text x="22" y="95" class="base-diagram__small">Full</text><text x="22" y="130" class="base-diagram__small">Half-full</text><path d="M170 40 V240" class="base-diagram__steel"/><path d="M182 44 H188 V98 H182" class="base-diagram__dim"/><path d="M182 102 H188 V136 H182" class="base-diagram__dim"/><path d="M182 140 H188 V238 H182" class="base-diagram__dim"/><text x="198" y="66" class="base-diagram__label">Headspace</text><text x="198" y="83" class="base-diagram__small">Damp air and condensate</text><text x="198" y="116" class="base-diagram__label">Waterline band</text><text x="198" y="133" class="base-diagram__small">Wet, then dry, then wet again</text><text x="198" y="184" class="base-diagram__label">Submerged wall</text><text x="198" y="201" class="base-diagram__small">Always under water</text><text x="198" y="280" class="base-diagram__label">Outside face: open air</text><path d="M194 276 L174 228" class="base-diagram__lead"/><text x="22" y="200" class="base-diagram__label">Stored water</text></svg>
