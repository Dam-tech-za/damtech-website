<svg viewBox="0 0 420 270" role="img" aria-label="Cross-section of a farm dam showing manure and fertiliser run-off, a grass buffer strip, a fence that keeps cattle out of the water and a pipe to a clean drinking trough." class="base-diagram__svg"><defs><pattern id="fdwq-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" class="base-diagram__hatch-line"/></pattern></defs><path d="M0 110 L110 160 L150 200 H250 L290 160 H420 V230 H0 Z" fill="url(#fdwq-hatch)" class="base-diagram__ground"/><path d="M0 110 L110 160 L150 200 H250 L290 160 H420" class="base-diagram__surface"/><path d="M118 168 L150 200 H250 L282 168 Z" class="base-diagram__water"/><text x="200" y="190" text-anchor="middle" class="base-diagram__small">Farm dam</text><path d="M84 148 L82 141 M90 151 L88 144 M96 154 L94 147 M102 156 L100 149 M108 159 L106 152" class="base-diagram__surface"/><path d="M24 93 L72 116 M62 117 L72 116 L67 108" class="base-diagram__dim"/><text x="14" y="36" text-anchor="start" class="base-diagram__label">Run-off carries manure</text><text x="14" y="54" text-anchor="start" class="base-diagram__label">and fertiliser</text><path d="M48 60 L46 98" class="base-diagram__lead"/><path d="M300 136 V160 M318 136 V160 M336 136 V160 M300 142 H336 M300 150 H336" class="base-diagram__surface"/><rect x="356" y="146" width="50" height="14" class="base-diagram__concrete"/><rect x="359" y="148" width="44" height="6" class="base-diagram__water"/><path d="M236 196 C280 196 300 176 356 154" class="base-diagram__liner"/><text x="406" y="66" text-anchor="end" class="base-diagram__label">Fence keeps cattle out</text><path d="M262 72 L300 134" class="base-diagram__lead"/><text x="406" y="120" text-anchor="end" class="base-diagram__label">Clean trough</text><path d="M384 126 L382 144" class="base-diagram__lead"/><text x="14" y="214" text-anchor="start" class="base-diagram__label">Grass strip filters run-off</text><path d="M96 202 L96 160" class="base-diagram__lead"/><text x="14" y="252" text-anchor="start" class="base-diagram__label">Shallow, warm water grows algae</text><path d="M230 244 L200 202" class="base-diagram__lead"/><text x="406" y="214" text-anchor="end" class="base-diagram__label">Pipe to trough</text><path d="M344 204 L300 182" class="base-diagram__lead"/></svg>
