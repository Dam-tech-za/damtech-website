<svg viewBox="0 0 420 270" role="img" aria-label="Two unlined farm dams side by side: in sandy soil water drains down through the floor, and in clay soil the banks crack as they dry out and water leaks through the cracks." class="base-diagram__svg"><defs><pattern id="ssc-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" class="base-diagram__hatch-line"/></pattern><pattern id="ssc-sand" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" class="base-diagram__grain"/><circle cx="6.5" cy="6" r="0.9" class="base-diagram__grain"/></pattern></defs><text x="14" y="28" text-anchor="start" class="base-diagram__label">Sandy soil</text><text x="14" y="46" text-anchor="start" class="base-diagram__small">Water drains straight through</text><text x="219" y="28" text-anchor="start" class="base-diagram__label">Clay soil</text><text x="219" y="46" text-anchor="start" class="base-diagram__small">Cracks open as it dries out</text><path d="M10 80 H45 L85 150 H130 L170 80 H205 V200 H10 Z" class="base-diagram__sand"/><path d="M10 80 H45 L85 150 H130 L170 80 H205 V200 H10 Z" fill="url(#ssc-sand)"/><path d="M56 100 L85 150 H130 L159 100 Z" class="base-diagram__water"/><path d="M94 156 V188 M90 182 L94 188 L98 182 M108 156 V188 M104 182 L108 188 L112 182 M122 156 V188 M118 182 L122 188 L126 182 M68 126 L48 150 M48 143 L48 150 L55 150 M148 126 L168 150 M168 143 L168 150 L161 150" class="base-diagram__dim"/><path d="M215 80 H250 L290 150 H335 L375 80 H410 V200 H215 Z" fill="url(#ssc-hatch)" class="base-diagram__ground"/><path d="M267 110 L290 150 H335 L358 110 Z" class="base-diagram__water"/><path d="M215 80 H250 L290 150 H335 L375 80 H410" class="base-diagram__surface"/><path d="M228 80 L232 92 L227 103 L231 116 M240 80 L243 89 L239 98 M258 95 L254 106 L259 117 L255 128 M388 80 L384 92 L389 104 L385 117 M399 80 L396 90 L400 99 M366 95 L370 106 L366 118" class="base-diagram__dim"/><text x="21