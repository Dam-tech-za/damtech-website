<svg viewBox="0 0 420 250" role="img" aria-label="HDPE and LLDPE dam liners on gravel: stiff HDPE bends sharply over a stone, flexible LLDPE stretches over it, and a geotextile under either liner spreads the load." class="base-diagram__svg"><defs><pattern id="hl-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" class="base-diagram__hatch-line"/></pattern></defs><text x="14" y="26" text-anchor="start" class="base-diagram__label">HDPE</text><text x="14" y="42" text-anchor="start" class="base-diagram__small">On bare gravel</text><rect x="10" y="56" width="125" height="70" class="base-diagram__water"/><rect x="10" y="128" width="125" height="62" fill="url(#hl-hatch)" class="base-diagram__ground"/><path d="M60 128 L72 108 L84 128 Z" class="base-diagram__stone"/><path d="M10 127 H56 L72 104 L88 127 H135" class="base-diagram__liner"/><path d="M74 101 L82 82" class="base-diagram__lead"/><text x="70" y="70" text-anchor="start" class="base-diagram__small">Sharp bend:</text><text x="70" y="80" text-anchor="start" class="base-diagram__small">crack risk</text><text x="14" y="212" text-anchor="start" class="base-diagram__small">Stiff sheet, yields at</text><text x="14" y="226" text-anchor="start" class="base-diagram__small">about 12% stretch</text><text x="149" y="26" text-anchor="start" class="base-diagram__label">LLDPE</text><text x="149" y="42" text-anchor="start" class="base-diagram__small">On bare gravel</text><rect x="145" y="56" width="125" height="70" class="base-diagram__water"/><rect x="145" y="128" width="125" height="62" fill="url(#hl-hatch)" class="base-diagram__ground"/><path d="M195 128 L207 108 L219 128 Z" class="base-diagram__stone"/><path d="M145 127 H181 Q207 90 233 127 H270" class="base-diagram__liner"/><path d="M209 106 L217 82" class="base-diagram__lead"/><text x="205" y="70" text-anchor="start" class="base-diagram__small">Stretches</text><text x="205" y="80" text-anchor="start" class="base-diagram__small">over stone</text><text x="149" y="212" text-anchor="start" class="base-diagram__small">Flexible sheet, no</text><text x="149" y="226" text-anchor="start" class="base-diagram__small">stress cracking</text><text x="284" y="26" text-anchor="start" class="base-diagram__label">Either</text><text x="284" y="42" text-anchor="start" class="base-diagram__small">On geotextile</text><rect x="280" y="56" width="130" height="58" class="base-diagram__water"/><rect x="280" y="128" width="130" height="62" fill="url(#hl-hatch)" class="base-diagram__ground"/><path d="M330 128 L342 120 L354 128 Z" class="base-diagram__stone"/><path d="M280 119 H410" class="base-diagram__geo"/><path d="M280 115 H410" class="base-diagram__liner"/><path d="M372 121 L380 148" class="base-diagram__lead"/><text x="350" y="160" text-anchor="start" class="base-diagram__small">Geotextile</text><text x="284" y="212" text-anchor="start" class="base-diagram__small">Load spread: same</text><text x="284" y="226" text-anchor="start" class="base-diagram__small">thickness for both</text><text x="14" y="244" text-anchor="start" class="base-diagram__small">Not to scale.</text></svg>
