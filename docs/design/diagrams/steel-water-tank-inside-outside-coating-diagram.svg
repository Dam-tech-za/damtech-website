<svg viewBox="0 0 420 260" role="img" aria-label="Section through a lined steel water tank wall: the inside faces water and the liner carries the water duty; the outside faces the air, where Aluzinc lasts about 3.1 times as long as Z275." class="base-diagram__svg"><defs><pattern id="io-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" class="base-diagram__hatch-line"/></pattern></defs><rect x="0" y="212" width="420" height="24" fill="url(#io-hatch)" class="base-diagram__ground"/><path d="M0 212 H420" class="base-diagram__surface"/><rect x="16" y="92" width="182" height="118" class="base-diagram__water"/><path d="M16 210 H199 V52" class="base-diagram__liner"/><path d="M204 44 V212" class="base-diagram__steel"/><text x="16" y="30" class="base-diagram__label">Inside: water</text><text x="16" y="48" class="base-diagram__small">The liner carries the water duty</text><text x="226" y="30" class="base-diagram__label">Outside: open air</text><text x="226" y="48" class="base-diagram__small">Aluzinc lasts about 3.1 × Z275 here</text><text x="28" y="150" class="base-diagram__label">PVC liner</text><path d="M100 146 L196 120" class="base-diagram__lead"/><text x="226" y="132" class="base-diagram__label">Metal coating</text><text x="226" y="150" class="base-diagram__label">faces the air</text><path d="M222 136 L208 128" class="base-diagram__lead"/><text x="16" y="254" class="base-diagram__small">Choose the water barrier first, then the coating for the outside</text></svg>
